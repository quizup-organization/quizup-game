spring:
  application:
    name: quizup-game
  profiles:
    default: local

  flyway:
    locations: classpath:db/migration/game

axon:
  distributed:
    enabled: true

microservice:
  swagger:
    description: QuizUp Game Module - Game sessions and gameplay management

logging:
  level:
    io.github.quizup: ${QUIZUP_LOG_LEVEL:INFO}
